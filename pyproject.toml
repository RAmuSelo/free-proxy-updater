[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-proxy-updater"
version = "0.1.0"
description = "Scrape public free-proxy lists (HTTP/SOCKS) and validate them in parallel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The free-proxy-updater authors" }]
keywords = ["proxy", "socks", "http", "scraper", "validator", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "PySocks",
]

[project.optional-dependencies]
dev = ["build"]

[project.urls]
Homepage = "https://github.com/RAmuSelo/free-proxy-updater"
Source = "https://github.com/RAmuSelo/free-proxy-updater"
Issues = "https://github.com/RAmuSelo/free-proxy-updater/issues"

[project.scripts]
free-proxy-updater = "free_proxy_updater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
